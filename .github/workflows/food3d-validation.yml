name: Food 3D validation

on:
  pull_request:
    paths:
      - "public/food-models.js"
      - "public/food-geo.js"
      - "public/food-scene.js"
      - "tests/food3d.test.mjs"
      - "src/catalog.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  food3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/food3d.test.mjs
