name: Menuza tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Check serverless API syntax
        run: node --check 'api/[...path].mjs'
      - name: Check migration scripts syntax
        run: |
          node --check scripts/migrate-sqlite-to-postgres.mjs
          node --check scripts/migrate-neon.mjs
