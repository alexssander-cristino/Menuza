name: Menuza security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete automated test suite
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check security-sensitive JavaScript syntax
        run: |
          node --check public/app.js
          node --check server.mjs
          node --check 'api/[...path].mjs'
          node --check src/storage/neon.mjs
          node --check src/storage/image-validation.mjs
          node --check src/security/file-validation.mjs
          node --check src/security/rate-limit.mjs
          node --check api/catalog.mjs
