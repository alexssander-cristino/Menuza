name: Build Menuza Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_flutter/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project scaffold
        shell: bash
        run: |
          flutter create --platforms=android --project-name menuza_mobile --org br.com.menuza "$RUNNER_TEMP/menuza_build"
          cp mobile_flutter/pubspec.yaml "$RUNNER_TEMP/menuza_build/pubspec.yaml"
          mkdir -p "$RUNNER_TEMP/menuza_build/lib"
          cp mobile_flutter/lib/main.dart "$RUNNER_TEMP/menuza_build/lib/main.dart"
          cp mobile_flutter/android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/menuza_build/android/app/src/main/AndroidManifest.xml"

      - name: Install Flutter dependencies
        working-directory: ${{ runner.temp }}/menuza_build
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/menuza_build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: menuza-flutter-debug
          path: ${{ runner.temp }}/menuza_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
