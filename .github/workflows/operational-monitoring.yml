name: Menuza operational monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check API and Neon database
        env:
          MENUZA_HEALTH_URL: ${{ vars.MENUZA_HEALTH_URL || 'https://menuza-five.vercel.app/api/health' }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 5 --max-time 20 "$MENUZA_HEALTH_URL")"
          printf '%s' "$response" | jq -e '.ok == true and .database == "connected"' >/dev/null
          worker_configured="$(printf '%s' "$response" | jq -r '.worker.configured // false')"
          worker_healthy="$(printf '%s' "$response" | jq -r '.worker.healthy // false')"
          if [ "$worker_configured" = "true" ] && [ "$worker_healthy" != "true" ]; then
            echo "::warning::API and Neon are healthy, but the optional TripoSR worker has no recent heartbeat."
          fi
      - name: Notify operational failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then echo "ALERT_WEBHOOK_URL não configurado; alerta disponível no Actions."; exit 0; fi
          curl --fail --silent --show-error -X POST "$ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data '{"text":"Menuza: API ou PostgreSQL indisponível. Consulte o GitHub Actions."}'
