<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#1b1530">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<title>404 · Página não encontrada | Menuza</title>
<style>
:root{color-scheme:light;--ink:#211a34;--muted:#716b80;--purple:#6d4bd1;--line:#e8e3f0}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#eee8ff 0,transparent 42%),#faf9fc;color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,560px);padding:clamp(28px,6vw,52px);border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 24px 80px #26174712}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.04em;font-size:21px;color:inherit;text-decoration:none}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#211a34;color:white;font-size:21px}
.code{margin:42px 0 8px;color:var(--purple);font-size:13px;font-weight:850;letter-spacing:.18em}
h1{margin:0;font-size:clamp(34px,7vw,50px);line-height:1.05;letter-spacing:-.06em}
p{margin:16px 0 0;color:var(--muted)}
.illustration{display:grid;place-items:center;width:100%;height:130px;margin:26px 0 8px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#faf8ff,#f2edff);overflow:hidden}
.illustration span{font-size:76px;line-height:1;font-weight:900;letter-spacing:-.09em;color:#d6c9ff;text-shadow:3px 3px 0 #eee8ff}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
a.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:750;text-decoration:none;transition:transform .18s ease,background .18s ease}
a.button:hover{transform:translateY(-2px)}
a.primary{background:var(--ink);border-color:var(--ink);color:white}
.note{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:12px}
@media(prefers-reduced-motion:reduce){a.button{transition:none}}
</style>
</head>
<body><main>
<a class="brand" href="/" aria-label="Menuza — voltar ao início"><span class="mark">m</span>menuza</a>
<div class="code">ERRO 404 · PÁGINA NÃO ENCONTRADA</div>
<div class="illustration" aria-hidden="true"><span>404</span></div>
<h1>Ops, esse caminho não existe.</h1>
<p>O endereço pode estar incorreto ou a página pode ter sido movida. Vamos levar você de volta para um lugar conhecido.</p>
<div class="actions"><a class="button primary" href="/">Voltar ao cardápio</a><a class="button" href="javascript:history.back()" onclick="if(history.length<2){location.href='/';return false}">Página anterior</a></div>
<p class="note">Erro 404 — confira o endereço ou volte ao início do Menuza.</p>
</main></body></html>
